<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Book Detail — LittleBookExchange</title>
<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Nunito', sans-serif; background: #fffbf0; color: #2d2d2d; }
nav { background: #fff; padding: 0 32px; height: 68px; display: flex; align-items: center; justify-content: space-between; border-bottom: 4px solid #f97316; }
.nav-logo { font-family: 'Pacifico', cursive; font-size: 22px; color: #f97316; display: flex; align-items: center; gap: 10px; cursor: pointer; }
.nav-logo .icon { background: #f97316; border-radius: 50%; width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; font-size: 18px; }
.nav-links { display: flex; gap: 22px; align-items: center; }
.nav-links a { text-decoration: none; color: #2d2d2d; font-weight: 700; font-size: 15px; }
.nav-btn { background: #f97316; color: #fff !important; padding: 9px 22px; border-radius: 999px; font-weight: 800 !important; }

.page { max-width: 680px; margin: 0 auto; padding: 40px 32px; }
.back { color: #f97316; font-weight: 700; font-size: 14px; display: inline-block; margin-bottom: 24px; text-decoration: none; }
.card { background: #fff; border-radius: 28px; overflow: hidden; border: 2px solid #f3f4f6; box-shadow: 0 8px 0 #e5e7eb; }
.cover { height: 280px; display: flex; align-items: center; justify-content: center; font-size: 100px; position: relative; }
.c1{background:linear-gradient(145deg,#fde68a,#fca5a5);}
.c2{background:linear-gradient(145deg,#99f6e4,#bfdbfe);}
.c3{background:linear-gradient(145deg,#fca5a5,#fda4af);}
.c4{background:linear-gradient(145deg,#c4b5fd,#93c5fd);}
.c5{background:linear-gradient(145deg,#6ee7b7,#fde68a);}
.c6{background:linear-gradient(145deg,#fdba74,#fb7185);}
.c7{background:linear-gradient(145deg,#a5f3fc,#6ee7b7);}
.c8{background:linear-gradient(145deg,#ddd6fe,#fca5a5);}
.price-tag { position: absolute; top: 20px; right: 20px; padding: 8px 20px; border-radius: 999px; font-size: 16px; font-weight: 900; }
.tag-free { background: #0d9488; color: #fff; }
.tag-sale { background: #f97316; color: #fff; }
.body { padding: 32px; }
.book-title { font-family: 'Pacifico', cursive; font-size: 30px; margin-bottom: 4px; color: #1a1a1a; }
.book-author { color: #888; font-weight: 700; font-size: 18px; margin-bottom: 20px; }
.badges { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 20px; }
.badge { padding: 8px 16px; border-radius: 12px; font-size: 13px; font-weight: 800; }
.badge-cond { background: #fef9c3; color: #854d0e; border: 2px solid #fde047; }
.badge-genre { background: #f3f4f6; color: #555; }
.badge-city  { background: #f0fdf4; color: #166534; border: 2px solid #bbf7d0; }
.desc { color: #666; font-weight: 600; line-height: 1.7; margin-bottom: 28px; font-size: 15px; }
.divider { border: none; border-top: 2px dashed #e5e7eb; margin-bottom: 24px; }
.footer-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.seller { color: #888; font-size: 14px; font-weight: 600; }
.seller strong { color: #1a1a1a; font-weight: 900; }
.btn-group { display: flex; gap: 12px; align-items: center; }
.save-btn { display: flex; align-items: center; gap: 8px; padding: 14px 24px; border-radius: 999px; font-weight: 800; font-size: 16px; border: 2.5px solid #fda4af; background: #fff; color: #f43f5e; cursor: pointer; font-family: 'Nunito', sans-serif; transition: all 0.15s; }
.save-btn:hover, .save-btn.saved { background: #fff0f3; border-color: #f43f5e; }
.save-btn svg { pointer-events: none; }
.msg-btn { background: #f97316; color: #fff; padding: 14px 32px; border-radius: 999px; font-weight: 800; font-size: 16px; border: none; cursor: pointer; box-shadow: 0 4px 0 #c2410c; font-family: 'Nunito', sans-serif; }
.buy-btn { background: #0d9488; color: #fff; padding: 14px 32px; border-radius: 999px; font-weight: 800; font-size: 16px; border: none; cursor: pointer; box-shadow: 0 4px 0 #0f766e; font-family: 'Nunito', sans-serif; display: none; }
.buy-btn:hover { background: #0f766e; }

.toast { position: fixed; bottom: 32px; left: 50%; transform: translateX(-50%) translateY(80px); background: #1a1a1a; color: #fff; padding: 12px 24px; border-radius: 999px; font-weight: 800; font-size: 14px; transition: transform 0.25s; z-index: 999; }
.toast.show { transform: translateX(-50%) translateY(0); }

footer { background: #1a1a1a; color: #999; text-align: center; padding: 26px 32px; font-size: 14px; font-weight: 700; margin-top: 60px; }
footer span { color: #f97316; font-family: 'Pacifico', cursive; font-size: 16px; }
</style>
</head>
<body>
<nav>
  <div class="nav-logo" onclick="location.href='homepage.html'"><div class="icon">🏡</div> LittleBookExchange</div>
  <div class="nav-links">
    <a href="browse.html">Browse</a>
    <a href="post-listing.html">Post a Book</a>
    <a href="messages.html">Messages</a>
    <a href="profile.html">Profile</a>
    <a href="homepage.html" class="nav-btn">Sign Out</a>
  </div>
</nav>

<div class="page">
  <a href="browse.html" class="back">← Back to listings</a>
  <div class="card" id="book-card">
    <div class="cover c1" id="book-cover">📘
      <div class="price-tag tag-free" id="price-tag">FREE</div>
    </div>
    <div class="body">
      <div class="book-title" id="book-title">Loading...</div>
      <div class="book-author" id="book-author"></div>
      <div class="badges" id="badges"></div>
      <p class="desc" id="book-desc"></p>
      <hr class="divider"/>
      <div class="footer-row">
        <p class="seller">Listed by <strong>a neighbor</strong></p>
        <div class="btn-group">
          <button class="save-btn" id="save-btn" onclick="toggleSave()">
            <svg id="heart-svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#f43f5e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
            <span id="save-label">Save</span>
          </button>
          <button class="buy-btn" id="buy-btn" onclick="location.href='checkout.html'">🛍️ Buy Now</button>
          <button class="msg-btn" onclick="location.href='message-thread.html'">💬 Message Seller</button>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
<footer><span>LittleBookExchange</span> · Books finding new homes in your neighborhood · © 2026</footer>

<script>
const SEED = [
  {id:1,  title:"The Great Gatsby",       author:"F. Scott Fitzgerald", genre:"Fiction",     condition:"Good",       price:0, city:"Chicago, IL", emoji:"📘", gradient:"c1", mine:false, status:"active", desc:"A classic American novel in great shape — no markings, tight binding. Perfect for someone who hasn't read it yet or wants a fresh copy. Happy to meet anywhere nearby!"},
  {id:2,  title:"Educated",               author:"Tara Westover",       genre:"Non-Fiction", condition:"Fair",       price:3, city:"Chicago, IL", emoji:"📗", gradient:"c2", mine:false, status:"active", desc:"A powerful memoir about growing up in a survivalist family in Idaho. Some light wear on the cover but pages are clean."},
  {id:3,  title:"Atomic Habits",          author:"James Clear",          genre:"Self-Help",   condition:"Good",       price:5, city:"Chicago, IL", emoji:"📕", gradient:"c3", mine:false, status:"active", desc:"Life-changing book on building good habits. Read once, in excellent condition. Some light pencil notes in margins."},
  {id:4,  title:"Harry Potter",           author:"J.K. Rowling",         genre:"Fiction",     condition:"Well-Loved", price:0, city:"Chicago, IL", emoji:"📙", gradient:"c4", mine:false, status:"active", desc:"The Sorcerer's Stone — well-loved but all pages intact. Great for a first reader!"},
  {id:5,  title:"Where the Crawdads Sing",author:"Delia Owens",          genre:"Fiction",     condition:"Good",       price:2, city:"Chicago, IL", emoji:"📒", gradient:"c5", mine:false, status:"active", desc:"Beautiful story, read once. Minor crease on front cover otherwise perfect condition."},
  {id:6,  title:"The Alchemist",          author:"Paulo Coelho",         genre:"Fiction",     condition:"Fair",       price:0, city:"Chicago, IL", emoji:"📓", gradient:"c6", mine:false, status:"active", desc:"Inspirational fable, free to a good home. Some yellowing on pages but fully readable."},
  {id:7,  title:"Becoming",               author:"Michelle Obama",       genre:"Biography",   condition:"Good",       price:4, city:"Chicago, IL", emoji:"📔", gradient:"c7", mine:false, status:"active", desc:"Hardcover edition in great shape. An incredible read — one of my favorites."},
  {id:8,  title:"The Hunger Games",       author:"Suzanne Collins",      genre:"Fiction",     condition:"Well-Loved", price:0, city:"Chicago, IL", emoji:"📖", gradient:"c8", mine:false, status:"active", desc:"Beloved trilogy opener. Pages intact, cover shows wear. FREE to whoever wants it!"},
  {id:9,  title:"To Kill a Mockingbird",  author:"Harper Lee",           genre:"Fiction",     condition:"Good",       price:1, city:"Chicago, IL", emoji:"📘", gradient:"c1", mine:false, status:"active", desc:"Timeless classic in good condition. Small price just to make sure it goes to someone who'll read it."},
  {id:10, title:"1984",                   author:"George Orwell",        genre:"Fiction",     condition:"Fair",       price:0, city:"Chicago, IL", emoji:"📗", gradient:"c2", mine:false, status:"active", desc:"Orwell's classic — free to take. Cover is a bit worn but the text is all there."},
];

function getListings() {
  if (!localStorage.getItem('lbe_listings')) {
    localStorage.setItem('lbe_listings', JSON.stringify(SEED));
  }
  return JSON.parse(localStorage.getItem('lbe_listings'));
}
function getSaved() { return JSON.parse(localStorage.getItem('lbe_saved') || '[]'); }
function setSaved(s) { localStorage.setItem('lbe_saved', JSON.stringify(s)); }

let currentBook = null;

function loadBook() {
  const id  = parseInt(localStorage.getItem('lbe_current_book') || '1');
  const all = getListings();
  // Merge seed descriptions for seed books
  const book = all.find(b => b.id === id) || all[0];
  if (!book) return;

  // Fill in description from SEED if not present
  const seed = SEED.find(s => s.id === book.id);
  if (!book.desc && seed) book.desc = seed.desc;

  currentBook = book;

  // Cover
  const cover = document.getElementById('book-cover');
  cover.className = `cover ${book.gradient}`;
  cover.innerHTML = book.emoji;

  // Price tag
  const tag = document.createElement('div');
  tag.id = 'price-tag';
  tag.className = `price-tag ${book.price===0?'tag-free':'tag-sale'}`;
  tag.textContent = book.price===0 ? 'FREE' : `$${Number(book.price).toFixed(2)}`;
  cover.appendChild(tag);

  document.getElementById('book-title').textContent  = book.title;
  document.getElementById('book-author').textContent = `by ${book.author}`;
  document.getElementById('book-desc').textContent   = book.desc || 'A great book looking for a new home!';

  const badges = document.getElementById('badges');
  badges.innerHTML = `
    <span class="badge badge-cond">${book.condition} Condition</span>
    <span class="badge badge-genre">${book.genre}</span>
    <span class="badge badge-city">📍 ${book.city}</span>`;

  document.title = `${book.title} — LittleBookExchange`;

  if (book.price > 0) document.getElementById('buy-btn').style.display = 'block';

  // Heart state
  const saved = getSaved().some(s => s.id === book.id);
  updateSaveBtn(saved);
}

function updateSaveBtn(saved) {
  const btn = document.getElementById('save-btn');
  const svg = document.getElementById('heart-svg');
  const lbl = document.getElementById('save-label');
  btn.classList.toggle('saved', saved);
  svg.setAttribute('fill', saved ? '#f43f5e' : 'none');
  lbl.textContent = saved ? 'Saved ✓' : 'Save';
}

function toggleSave() {
  if (!currentBook) return;
  let saved = getSaved();
  const idx = saved.findIndex(s => s.id === currentBook.id);
  if (idx >= 0) {
    saved.splice(idx, 1);
    setSaved(saved);
    updateSaveBtn(false);
    showToast('💔 Removed from saved');
  } else {
    saved.push(currentBook);
    setSaved(saved);
    updateSaveBtn(true);
    showToast('❤️ Saved to your profile!');
  }
}

let toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}

loadBook();
</script>
</body>
</html>
